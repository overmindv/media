name: ci.yml
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run tests
        run: make test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build service
        run: make build

  component:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tasks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tasks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COMPONENT_TEST_DSN: postgres://postgres:postgres@localhost:5432/tasks?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start ClamAV with a test signature
        run: |
          docker run -d --name media-test-clamd \
            --mount "type=bind,source=$PWD/internal/worker/testdata,target=/fixture,readonly" \
            -p 127.0.0.1:3310:3310 --entrypoint /usr/sbin/clamd \
            clamav/clamav@sha256:21622d96b8a7080af7974d99ca60a9e061eff5ff831ed6986d00953fc19ff67f --config-file=/fixture/clamd.conf
          for _ in $(seq 1 30); do
            if docker exec media-test-clamd sh -c 'echo PING | nc -w 1 127.0.0.1 3310 | grep -q PONG'; then
              exit 0
            fi
            sleep 1
          done
          docker logs media-test-clamd
          exit 1
      - name: Run component tests
        run: make ctest
        env:
          MEDIA_TEST_CLAMAV_ADDR: 127.0.0.1:3310

